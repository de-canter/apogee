name: release
on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Package tag to release, e.g. agent-v0.1.0'
        required: true
        type: string
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME=$(printf '%s' "$TAG" | sed -E 's/^(.+)-v([0-9.]+)$/\1/')
          VERSION=$(printf '%s' "$TAG" | sed -E 's/^(.+)-v([0-9.]+)$/\2/')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        run: |
          mkdir -p release
          pnpm -C "packages/${{ steps.tag.outputs.name }}" pack --pack-destination ../../release
          ls -la release
      - name: Publish to npm
        # Needs the NPM_TOKEN repo secret (a granular token with publish rights on @de_canter).
        # Skipped when the secret is absent so the tarball release still happens.
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Run from inside the package: `pnpm -C <dir> publish` forwards the
        # directory to `npm publish` as a stray positional argument (EUSAGE).
        working-directory: packages/${{ steps.tag.outputs.name }}
        run: pnpm publish --access public --provenance --no-git-checks
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.tgz --clobber
          else
            gh release create "$TAG" release/*.tgz --title "$TAG" --notes "Tarball for @de_canter/apogee-${{ steps.tag.outputs.name }} ${{ steps.tag.outputs.version }}. See docs/consuming.md for the dependency and overrides block."
          fi
